<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面向角色的JSON战斗策略编辑器</title>
<style>
:root{
  --bg:#14161a; --bg2:#1b1e24; --bg3:#22262e; --line:#2f343d; --line2:#3c4350;
  --fg:#e6e9ef; --fg2:#a8b0be; --fg3:#6f7889;
  --acc:#5aa9ff; --acc2:#1d6fd6; --ok:#4ec97f; --warn:#e8b339; --err:#ff6b6b; --purple:#b98cff;
  --e0:#9aa0a6; --e1:#8fe3ff; --e2:#ff7a52; --e3:#4cc2ff; --e4:#b98cff; --e5:#6fe0b8; --e6:#ffd166; --e7:#9ade4b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--fg)}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;vertical-align:-2px}
button{background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:#2b303a;border-color:var(--line2)}
button.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.primary:hover{background:#2b7fe6}
button.danger{border-color:#5c2b2b;color:#ff9a9a}
button.danger:hover{background:#3a2222}
button.mini{padding:1px 7px;font-size:12px;border-radius:5px}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--acc)}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
header .sub{color:var(--fg3);font-size:12px}
nav{display:flex;gap:6px;margin-left:8px}
nav button{padding:5px 14px}
nav button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
header .spacer{flex:1}
.badge{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;line-height:17px;margin-left:5px;vertical-align:1px}
.badge.err{background:#4a2020;color:#ffb3b3;border:1px solid #6b2d2d}
.badge.warn{background:#463a17;color:#ffe0a3;border:1px solid #6b5a26}
.badge.ok{background:#1e3d2a;color:#a8e6c1;border:1px solid #2c5c3e}
.main{flex:1;display:flex;min-height:0}
.pane{flex:1;overflow:auto;padding:14px 16px}
.pane.hidden{display:none}
.side{width:330px;flex:none;border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:10px 12px}
.side.hidden{display:none}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card>h3{margin:0 0 8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card>h3 .hint{font-weight:400;color:var(--fg3);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.mb{margin-bottom:8px}
label.f{display:flex;align-items:center;gap:6px;color:var(--fg2);white-space:nowrap}
.grid2{display:grid;grid-template-columns:max-content 1fr;gap:8px 10px;align-items:center}
.hint{color:var(--fg3);font-size:12px}
.warnbox{background:#2b2312;border:1px solid #6b5a26;border-radius:6px;padding:6px 9px;color:#ffe0a3;font-size:12px}
.errbox{background:#2c1a1a;border:1px solid #6b2d2d;border-radius:6px;padding:6px 9px;color:#ffb3b3;font-size:12px}
.okbox{background:#1a2b21;border:1px solid #2c5c3e;border-radius:6px;padding:6px 9px;color:#a8e6c1;font-size:12px}
.mono{font-family:Consolas,"Courier New",monospace}
.kw{color:var(--acc)}
.dim{color:var(--fg3)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
textarea{width:100%;resize:vertical;line-height:1.55}
select{padding:3px 4px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--line2);border-radius:12px;padding:1px 5px 1px 7px;font-size:12px;margin:2px 4px 2px 0}
.tag button{border:0;background:none;padding:0 2px;color:var(--fg3);cursor:pointer;font-size:13px}
.tag button:hover{color:var(--err)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip.on{background:#20364f;border-color:var(--acc2)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
th{color:var(--fg2);font-weight:600;background:var(--bg3);position:sticky;top:0;z-index:1}
tr:hover td{background:#1d2128}
.pri{font-family:Consolas,monospace;font-weight:700}
.pri.hi{color:#ff9a9a}
.pri.mid{color:#e8b339}
.pri.low{color:#8fd0ff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal.hidden{display:none}
.modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;max-width:900px;width:92%;max-height:86vh;display:flex;flex-direction:column}
.modal .box>h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.modal .body{padding:14px 16px;overflow:auto}
.modal .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none}
.rolelist{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.roleitem{display:flex;align-items:center;gap:7px;padding:2px 8px;cursor:pointer;font-size:12.5px}
.roleitem:hover{background:#232833}
.roleitem .nm{flex:1}
.roleitem .cnt{color:var(--fg3);font-size:11.5px}
.secgroup{padding:3px 8px;background:var(--bg3);color:var(--fg2);font-size:11.5px;position:sticky;top:0}
.actioncard{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;margin-bottom:10px}
.actioncard.err{border-left-color:var(--err)}
.actioncard.warn{border-left-color:var(--warn)}
.actioncard .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;flex-wrap:wrap}
.actioncard .hd .nm{font-weight:600}
.actioncard .bd{padding:0 10px 10px;border-top:1px solid var(--line)}
details.det{margin:8px 0;padding:2px 0}
details.det>summary{font-weight:600;color:var(--fg);padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
details.det>summary .hint{font-weight:400}
details.det.sub{margin:6px 0;padding:0}
details.det.sub>summary{font-weight:400;color:var(--fg2);border-bottom:0;margin-bottom:2px}
details.det.sub>summary:hover{color:var(--fg)}
/* 折叠区块标题旁的「语句预览」（动作指令 / 触发条件 / 队友条件）：最多显示 2 行，再长的内容截断，
   避免超长指令串把卡片标题撑得很高（完整内容展开后可见） */
details.det>summary .prev{display:inline-block;vertical-align:top;max-height:3.2em;overflow:hidden;white-space:normal;max-width:100%}
.condrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 7px;margin-bottom:5px}
.condrow .num{color:var(--fg3);width:16px;text-align:center;flex:none}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12.5px}
.kv .k{color:var(--fg2)}
.kv .v{color:var(--fg);word-break:break-all}
.tree{font-family:Consolas,monospace;font-size:12px;white-space:pre;color:var(--fg2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow:auto;max-height:210px}
details summary{cursor:pointer;color:var(--fg2)}
details summary:hover{color:var(--fg)}
.kbgrid{display:flex;flex-direction:column;gap:4px}
.kbrow{display:flex;gap:4px;flex-wrap:wrap}
.kb{min-width:30px;padding:3px 6px;font-size:12px;text-align:center}
.kb.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.scroll{max-height:320px;overflow:auto}
.split{display:flex;gap:14px;align-items:flex-start}
.split>.col{flex:1;min-width:0}
.pill{display:inline-block;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-size:11.5px;color:var(--fg2);font-family:Consolas,monospace}
.aref{border-bottom:1px dashed var(--line2);cursor:help;color:var(--acc)}
.stars{color:var(--e6);font-size:11px;letter-spacing:-1px}
.empty{color:var(--fg3);text-align:center;padding:26px 0}
.footerbar{flex:none;padding:6px 14px;background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:12px;color:var(--fg2)}
.footerbar .spacer{flex:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>面向角色的JSON战斗策略编辑器</h1>
    <span class="sub" id="hdrStatus">未命名策略</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <span id="hdrIssues"></span>
    <button id="btnIssues" class="mini">校验面板</button>
  </header>
  <div class="main">
    <div class="pane" id="paneInfo"></div>
    <div class="pane hidden" id="paneActions"></div>
    <div class="pane hidden" id="panePreview"></div>
    <div class="side" id="side"></div>
  </div>
  <div class="footerbar">
    <span id="footInfo"></span>
    <span class="spacer"></span>
    <span>草稿自动保存在浏览器本地（localStorage，按「策略名称 + 版本」归档）</span>
  </div>
</div>
<div class="modal hidden" id="modal"><div class="box">
  <h3 id="modalTitle"></h3>
  <div class="body" id="modalBody"></div>
  <div class="foot" id="modalFoot"></div>
</div></div>

/* ---------------- 词法 ---------------- */

function condIsIdentChar(ch) { return /[A-Za-z0-9_\u4e00-\u9fff\u3400-\u4dbf]/.test(ch); }

/**
 * 词法分析。known 为额外已知标识符（策略动作名），用于 '-' 合并判断。
 * 返回 { tokens, error }
 */
function condTokenize(src, known) {
  const knownSet = new Set([...COND_FUNCTION_SET]);
  if (known) for (const n of known) knownSet.add(String(n).toLowerCase());

  const tokens = [];
  let i = 0;
  const n = src.length;
  const isOpenBracket = (ch) => ch === '(' || ch === '（';

  while (i < n) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '（' || ch === '）' || ch === '，' || ch === '；' || ch === '：' || ch === '“' || ch === '”') {
      return { error: `第 ${i + 1} 个字符出现了中文标点「${ch}」，条件表达式只能用半角符号（必须是半角 () , 与英文运算符）` };
    }
    if (ch === '(') { tokens.push({ t: 'lparen', pos: i }); i++; continue; }
    if (ch === ')') { tokens.push({ t: 'rparen', pos: i }); i++; continue; }
    if (ch === ',') { tokens.push({ t: 'comma', pos: i }); i++; continue; }
    if (ch === '&' && src[i + 1] === '&') { tokens.push({ t: 'op', v: '&&', pos: i }); i += 2; continue; }
    if (ch === '|' && src[i + 1] === '|') { tokens.push({ t: 'op', v: '||', pos: i }); i += 2; continue; }
    if (ch === '&' || ch === '|') return { error: `第 ${i + 1} 个字符处出现了单个「${ch}」，逻辑运算必须写成 && 或 ||` };
    if (ch === '=' && src[i + 1] === '=') return { error: `第 ${i + 1} 个字符处出现了 ==，条件表达式没有 ==，相等比较请用单个 =` };
    if (ch === '!' && src[i + 1] === '=') return { error: `第 ${i + 1} 个字符处出现了 !=，请改写成 !(a=b)` };
    if (ch === '>' && src[i + 1] === '=') return { error: `第 ${i + 1} 个字符处出现了 >=，请改写成 !(a<b) 或 a>b || a=b` };
    if (ch === '<' && src[i + 1] === '=') return { error: `第 ${i + 1} 个字符处出现了 <=，请改写成 !(a>b) 或 a<b || a=b` };
    if ('!><='.includes(ch)) { tokens.push({ t: 'op', v: ch, pos: i }); i++; continue; }
    if (ch === '+' || ch === '*' || ch === '/') { tokens.push({ t: 'op', v: ch, pos: i }); i++; continue; }
    if (ch === '-') { tokens.push({ t: 'op', v: '-', pos: i }); i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i;
      while (j < n && /[0-9.]/.test(src[j])) j++;
      const raw = src.slice(i, j);
      if ((raw.match(/\./g) || []).length > 1) return { error: `数字「${raw}」不合法（小数点过多）` };
      tokens.push({ t: 'num', v: parseFloat(raw), raw, pos: i });
      i = j; continue;
    }
    if (condIsIdentChar(ch)) {
      let j = i;
      while (j < n && condIsIdentChar(src[j])) j++;
      // '-' 合并：向后尝试最长候选，命中已知标识符则整体作为一个标识符
      outer: while (j < n && src[j] === '-') {
        let k = j + 1;
        if (k >= n || !condIsIdentChar(src[k])) break;
        while (k < n && (condIsIdentChar(src[k]) || src[k] === '-')) k++;
        for (let e = k; e > j; e--) {
          if (src[e - 1] === '-') continue;
          const cand = src.slice(i, e);
          if (knownSet.has(cand.toLowerCase())) { j = e; break outer; }
        }
        break;
      }
      const word = src.slice(i, j);
      const lower = word.toLowerCase();
      if (lower === 'true' || lower === 'false') tokens.push({ t: 'bool', v: lower === 'true', pos: i, raw: word });
      else tokens.push({ t: 'ident', v: word, lower, pos: i });
      i = j; continue;
    }
    return { error: `第 ${i + 1} 个字符处出现了无法识别的字符「${ch}」` };
  }
  tokens.push({ t: 'eof', pos: n });
  return { tokens };
}

/* ---------------- 语法 ---------------- */

/** 文本是否已经被一对外层括号完整包住（`(a || b)`） */
function fullyParen(text) {
  const t = String(text || '').trim();
  if (!/^\(.*\)$/.test(t)) return false;
  let depth = 0;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === '(') depth++;
    else if (t[i] === ')') { depth--; if (depth === 0) return i === t.length - 1; }
  }
  return false;
}

function condParse(src, known) {
  // 空表达式在 BetterGI 中恒为真（Evaluate 对空白表达式直接返回 true），这里也用 ast=null 表示
  if (String(src || '').trim() === '') return { ast: null };
  const tk = condTokenize(src, known);
  if (tk.error) return { error: tk.error };
  const tokens = tk.tokens;
  let p = 0;
  const peek = () => tokens[p] || { t: 'eof', pos: src.length };
  const next = () => (p < tokens.length ? tokens[p++] : { t: 'eof', pos: src.length });

  const bad = (x) => x && x.error;
  function parseOr() {
    let left = parseAnd();
    while (!bad(left) && peek().t === 'op' && peek().v === '||') { next(); const right = parseAnd(); if (bad(right)) return right; left = { type: 'binary', op: '||', left, right }; }
    return left;
  }
  function parseAnd() {
    let left = parseCompare();
    while (!bad(left) && peek().t === 'op' && peek().v === '&&') { next(); const right = parseCompare(); if (bad(right)) return right; left = { type: 'binary', op: '&&', left, right }; }
    return left;
  }
  function parseCompare() {
    let left = parseAdd();
    while (!bad(left) && peek().t === 'op' && '><='.includes(peek().v)) { const op = next().v; const right = parseAdd(); if (bad(right)) return right; left = { type: 'binary', op, left, right }; }
    return left;
  }
  function parseAdd() {
    let left = parseMul();
    while (!bad(left) && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) { const op = next().v; const right = parseMul(); if (bad(right)) return right; left = { type: 'binary', op, left, right }; }
    return left;
  }
  function parseMul() {
    let left = parseUnary();
    while (!bad(left) && peek().t === 'op' && (peek().v === '*' || peek().v === '/')) { const op = next().v; const right = parseUnary(); if (bad(right)) return right; left = { type: 'binary', op, left, right }; }
    return left;
  }
  function parseUnary() {
    const t = peek();
    if (t.t === 'op' && t.v === '!') {
      next();
      const operand = parseUnary();
      if (bad(operand)) return operand;
      // 括号在 AST 里是透明的（parsePrimary 只把节点标记成 paren，聚合出来的新节点不带这个标记），
      // 但区分「整段取非」`!(甲 && 乙)` 与「逐项取非」`!甲 && !乙` 必须知道有没有这层括号
      // （两种写法拆出来的 in-party 链完全同形）。这里把「括号正好包住整个操作数」这个
      // 解析结果记到一元节点自己身上：`!((甲 || 乙))` 这种多包一层的不算。
      const wrapped = !!(operand && operand.paren && operand.parenEnd === peek().pos);
      if (operand && typeof operand === 'object') delete operand.parenEnd;
      return { type: 'unary', op: '!', operand, parenWrapped: wrapped };
    }
    if (t.t === 'op' && t.v === '-') { next(); const operand = parseUnary(); if (bad(operand)) return operand; return { type: 'unary', op: '-', operand }; }
    if (t.t === 'op' && t.v === '+') return { error: `第 ${t.pos + 1} 个字符处的 + 无法解析：条件表达式不支持一元正号` };
    return parsePrimary();
  }
  function parsePrimary() {
    const t = next();
    if (t.t === 'eof') return { error: src.trim() === '' ? '表达式为空' : '表达式在末尾意外结束（可能缺少操作数或括号未闭合）' };
    if (t.t === 'num') return { type: 'number', value: t.v };
    if (t.t === 'bool') return { type: 'bool', value: t.v };
    if (t.t === 'lparen') {
      const inner = parseOr();
      if (inner && inner.error) return inner;
      if (peek().t !== 'rparen') {
        const last = peek();
        if (last.t === 'eof') return { error: `括号不配对：第 ${t.pos + 1} 个字符处的 '(' 没有对应的 ')'（表达式在末尾意外结束）` };
        return { error: `括号不配对：第 ${t.pos + 1} 个字符处的 '(' 没有对应的 ')'` };
      }
      next();
      // 记下「这个节点外面本来有一层括号」：括号在 AST 里是透明的，但区分
      // `!(甲 && 乙)`（整段取非）与 `!甲 && !乙`（逐项取非）时必须知道有没有这层括号，
      // 这两种写法拆出来的 in-party 链完全同形。只做标记，不改变求值语义。
      if (inner && typeof inner === 'object') { inner.paren = true; inner.parenEnd = peek().pos; }
      return inner;
    }
    if (t.t === 'ident') {
      if (peek().t === 'lparen') {
        next();
        const args = [];
        if (peek().t !== 'rparen') {
          for (;;) {
            const a = parseOr();
            if (a && a.error) return a;
            args.push(a);
            if (peek().t === 'comma') { next(); continue; }
            break;
          }
        }
        if (peek().t !== 'rparen') return { error: `函数 ${t.v} 的括号不配对或参数分隔有误` };
        next();
        return { type: 'call', name: t.v, lower: t.lower, args, pos: t.pos };
      }
      // 裸标识符：既可能是零参数函数，也可能被当作“动作引用/变量”
      return { type: 'ident', name: t.v, lower: t.lower, pos: t.pos };
    }
    if (t.t === 'eof') return { error: src.trim() === '' ? '表达式为空' : '表达式在末尾意外结束（可能缺少操作数或括号未闭合）' };
    return { error: `第 ${t.pos + 1} 个字符处出现了意外的符号` };
  }

  const ast = parseOr();
  if (ast && ast.error) return { error: ast.error };
  if (!ast) return { error: src.trim() === '' ? '表达式为空' : '表达式不完整' };
  if (peek().t !== 'eof') return { error: `第 ${peek().pos + 1} 个字符处存在无法解析的多余内容` };
  return { ast };
}

/** 遍历 AST */
function condWalk(node, fn) {
  if (!node || node.error) return;
  fn(node);
  if (node.type === 'binary') { condWalk(node.left, fn); condWalk(node.right, fn); }
  else if (node.type === 'unary') condWalk(node.operand, fn);
  else if (node.type === 'call') for (const a of node.args) condWalk(a, fn);
}

function condDeepClone(node) {
  if (!node) return node;
  if (node.type === 'binary') return { ...node, left: condDeepClone(node.left), right: condDeepClone(node.right) };
  if (node.type === 'unary') return { ...node, operand: condDeepClone(node.operand) };
  if (node.type === 'call') return { ...node, args: node.args.map(condDeepClone) };
  return { ...node };
}

function condToText(node) {
  if (!node) return '';
  switch (node.type) {
    case 'number': return String(node.value);
    case 'bool': return node.value ? 'true' : 'false';
    case 'ident': return node.name;
    case 'call': return `${node.name}(${node.args.map(condToText).join(',')})`;
    case 'unary': {
      // 一元运算符只对它后面的 primary 生效，所以操作数是二元表达式时必须自己补括号：
      // 漏括号时 `!(a || b)` / `-(a - b)` 会被渲染成 `!a || b` / `-a - b`，
      // 文本再解析回来就变成了另一套优先级（BetterGI 与本站的解析器都按“括号内先整体求值”处理）
      const t = condToText(node.operand);
      const needParen = node.operand.type === 'binary' && !(node.op === '!' && node.parenWrapped && fullyParen(t));
      return `${node.op}${needParen ? `(${t})` : t}`;
    }
    case 'binary': {
      const l = node.left.type === 'binary' ? `(${condToText(node.left)})` : condToText(node.left);
      const r = node.right.type === 'binary' ? `(${condToText(node.right)})` : condToText(node.right);
      return `${l} ${node.op} ${r}`;
    }
    default: return '';
  }
}

/* ---------------- 动作名合法性 ---------------- */

const BOOL_LITERALS = new Set(['true', 'false']);

/** 动作名能否作为条件标识符解析（对照 ConditionEvaluator.IsValidActionName） */
function isValidActionName(name, allActionNames) {
  if (!name) return { ok: false, reason: '名称为空' };
  if (BOOL_LITERALS.has(name.toLowerCase())) return { ok: false, reason: '不能使用布尔字面量 true/false' };
  if (/^\d+(\.\d+)?$/.test(name)) return { ok: false, reason: '不能是纯数字' };
  if (COND_FUNCTION_SET.has(name.toLowerCase())) return { ok: false, reason: `不能与内置条件函数 ${name} 同名` };
  if (/[\s,()（）&|!><=+*/]/.test(name)) return { ok: false, reason: '不能包含空白、逗号、括号或运算符' };
  const known = [...COND_FUNCTION_NAMES, ...(allActionNames || [])];
  const tk = condTokenize(name, known);
  if (tk.error) return { ok: false, reason: tk.error };
  const real = tk.tokens.filter(t => t.t !== 'eof');
  if (real.length !== 1 || real[0].t !== 'ident') return { ok: false, reason: '无法作为单个标识符解析（可能被拆成了多段或运算符）' };
  if (real[0].v.toLowerCase() !== name.toLowerCase()) return { ok: false, reason: '无法作为单个标识符解析' };
  return { ok: true };
}

/* ---------------- 释义 ----------------
 * opts（可选）把「动作引用」渲染成人能看懂的样子：
 *   {
 *     actions:        [{ id, name, index, action, character, type }...],
 *     currentActionId: 当前正在编辑的动作的 id（引用它时显示「本动作」）
 *   }
 * 传了 opts 时，入参为动作的函数（since / count / last-exec）会把 index 或动作名换成
 * 「动作名」，并带一个鼠标悬停提示（index + 动作指令）；不传 opts 时保持纯文本（供测试与
 * 不支持 HTML 的地方使用）。
 */

/** HTML 转义（不依赖 ui_common.js 里的 esc，保证 cond.js 单独可用） */
function condEsc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** 动作引用节点 → 动作对象（支持 index 数字与裸动作名两种写法） */function condFindActionRef(ast, opts) {
  if (!ast || !opts || !Array.isArray(opts.actions)) return null;
  if (ast.type === 'number') return opts.actions.find(a => a.index === ast.value) || null;
  if (ast.type === 'ident') {
    const lower = String(ast.name).toLowerCase();
    return opts.actions.find(a => String(a.name || '').toLowerCase() === lower) || null;
  }
  if (ast.type === 'call' && ast.args.length === 0) {
    const lower = String(ast.lower || ast.name).toLowerCase();
    return opts.actions.find(a => String(a.name || '').toLowerCase() === lower) || null;
  }
  return null;
}

/** 命中当前动作（含「不填参数 = 本动作」与显式引用自己） */
function condIsSelfRef(ast, opts) {
  if (!opts || !opts.currentActionId) return false;
  const cur = (opts.actions || []).find(a => a.id === opts.currentActionId);
  if (!cur) return false;
  if (!ast) return true;                                   // 不填参数 = 本动作
  if (ast.type === 'number') return ast.value === cur.index;
  const lower = String(ast.type === 'call' ? (ast.lower || ast.name) : ast.name || '').toLowerCase();
  return !!cur.name && lower === String(cur.name).toLowerCase();
}

/** 动作引用的释义文本（传了 opts 时是人话，否则退回原文） */
function condRefText(ast, opts) {
  if (condIsSelfRef(ast, opts)) return '本动作';
  const hit = condFindActionRef(ast, opts);
  if (hit) return `动作「${hit.name || '(未命名)'}」`;
  if (!ast) return '本动作';
  if (ast.type === 'number') return `index=${ast.value} 的动作`;
  if (ast.type === 'ident') return `动作「${ast.name}」`;
  if (ast.type === 'call' && ast.args.length === 0) return `动作「${ast.name}」`;
  return `(${condToText(ast)})`;
}

/** 动作引用节点的悬停提示文本：index + 动作名（有动作指令时一并附上） */
function condRefTitle(hit) {
  const idx = hit && hit.index !== undefined && hit.index !== null ? hit.index : '';
  const cmd = String((hit && hit.action) || '').trim();
  return `index=${idx}　动作名：${(hit && hit.name) || '(未命名)'}${cmd ? `　动作指令：${cmd}` : ''}`;
}

/**
 * 动作引用的释义 HTML（动作名 + 悬停显示 index 与动作指令）。
 * 找不到对应动作 / 没传 opts 时退回 esc 过的纯文本。
 */
function condRefHtml(ast, opts) {
  const plain = condRefText(ast, opts);
  const hit = condFindActionRef(ast, opts);
  if (!hit) return condEsc(plain);
  const self = condIsSelfRef(ast, opts) ? '（本动作）' : '';
  return `<span class="aref" title="${condEsc(condRefTitle(hit))}">${condEsc(`动作「${hit.name || '(未命名)'}」${self}`)}</span>`;
}

/** 释义里的动作引用：传了 opts 用 HTML（带悬停提示），否则用纯文本 */
function condRefAny(ast, opts) {
  return opts ? condRefHtml(ast, opts) : condEsc(condRefText(ast, opts));
}

/* ---------------- 原样表达式 + 动作引用悬停提示 ----------------
 * 「优先级预览」的动作触发条件列要显示 **原始 expression 文本**，但鼠标移到
 * 「入参为动作的条件函数」（since / count / last-exec）的动作参数上时要提示这个动作的 index 与动作名。
 * 实现方式：先从 AST 定位出每个动作参数在原文里的 [start, end) 区间，再按区间把原文切片，
 * 只在切出来的那一段外面套一层 <span title="...">，其余字符原样输出 —— 所以列里看到的文本不会变。
 */

/** 条件函数里「入参是动作」的参数位置（与 condCollectRefs 保持一致） */
function condActionArgIndexes(lower, argc) {
  if (lower === 'since') return argc >= 1 ? [0] : [];
  if (lower === 'count') return argc >= 1 ? [0] : [];
  if (lower === 'last-exec') return argc >= 3 ? [2] : [];   // last-exec(秒数, 比较方向, 动作)
  return [];
}

/**
 * 从 src 的 from 处开始扫描一个「函数调用」，返回该调用各参数的 [start, end) 区间与结束位置。
 * 只处理条件表达式里合法出现的字符（括号配对由调用方保证），扫描到配对的右括号就结束。
 */
function condScanCallArgs(src, from) {
  let i = from;
  while (i < src.length && src[i] !== '(') i++;
  if (i >= src.length) return null;
  let depth = 0;
  const args = [];
  let curStart = -1;
  for (; i < src.length; i++) {
    const ch = src[i];
    if (ch === '(') { depth++; if (depth === 1) curStart = i + 1; }
    else if (ch === ')') {
      depth--;
      if (depth === 0) { args.push([curStart, i]); return { args, end: i + 1 }; }
    } else if (ch === ',' && depth === 1) {
      args.push([curStart, i]);
      curStart = i + 1;
    }
  }
  return null;
}

/**
 * 找出表达式原文里所有「入参为动作的那个参数」的字符区间。
 * 逐个扫描形如 since( / count( / last-exec( 的位置（前一个字符不是标识符字符，避免命中动作名里的子串），
 * 再按 condActionArgIndexes 挑出动作参数的位置。
 */
function condActionArgSpans(src) {
  const text = String(src || '');
  const out = [];
  const re = /(since|count|last-exec)\s*\(/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const at = m.index;
    if (at > 0 && /[A-Za-z0-9_\u4e00-\u9fff\u3400-\u4dbf]/.test(text[at - 1])) continue;  // 属于更长的标识符
    const lower = m[1].toLowerCase();
    const open = text.indexOf('(', at);
    const call = condScanCallArgs(text, open);
    if (!call) continue;
    for (const ai of condActionArgIndexes(lower, call.args.length)) {
      const rg = call.args[ai];
      if (!rg) continue;
      const s = rg[0], e = rg[1];
      if (s === undefined || e === undefined || e <= s) continue;
      out.push({ start: s, end: e, arg: text.slice(s, e) });
    }
    re.lastIndex = call.end;
  }
  out.sort((a, b) => a.start - b.start);
  const merged = [];
  for (const sp of out) {
    const last = merged[merged.length - 1];
    if (last && sp.start < last.end) continue;   // 区间重叠（嵌套调用）：保留外层
    merged.push(sp);
  }
  return merged;
}

/**
 * 保留原始写法、只给「入参为动作」的参数加上悬停提示的 HTML。
 * 表达式解析失败时返回 esc 过的原文，绝不改变显示内容。
 */
function condRawExprHtml(text, opts) {
  const src = String(text === null || text === undefined ? '' : text);
  if (!src) return '';
  const hitOf = (raw) => {
    const t = String(raw || '').trim();
    const a = condParse(t, []);
    if (!a.ast) return null;
    return condFindActionRef(a.ast, opts);
  };
  const spans = condActionArgSpans(src);
  if (!spans.length) return condEsc(src);
  let out = '';
  let cur = 0;
  for (const sp of spans) {
    const hit = hitOf(sp.arg);
    if (!hit) continue;
    out += condEsc(src.slice(cur, sp.start));
    out += `<span class="aref" title="${condEsc(condRefTitle(hit))}">${condEsc(src.slice(sp.start, sp.end))}</span>`;
    cur = sp.end;
  }
  out += condEsc(src.slice(cur));
  return out;
}

function condExplainFunction(call, opts) {
  const fn = COND_FUNCTION_BY_NAME.get(call.lower);
  if (!fn) return `未知函数 ${call.name}(...)`;

  const num = (a, d) => (a && a.type === 'number' ? a.value : d);
  const argText = (a) => condToText(a);
  const refArg = (a) => (opts ? condRefHtml(a, opts) : condEsc(condRefText(a, opts)));

  switch (fn.name) {
    case 't': return '开战至今的秒数';
    case 'battle-time': {
      const th = num(call.args[0], 0);
      const gt = call.args.length > 1 ? !(call.args[1].type === 'bool' && call.args[1].value === false) : true;
      return `开战时间${gt ? '超过' : '不足'} ${th} 秒`;
    }
    case 'since': {
      if (call.args.length === 0) return '本动作距上次执行的秒数（从未执行过时为 +∞，所以 since>X 开场即为真）';
      return `${refArg(call.args[0])} 距上次执行的秒数（从未执行过时为 +∞）`;
    }
    case 'count': {
      const target = call.args.length === 0 ? '本动作' : refArg(call.args[0]);
      if (call.args.length <= 1) return `${target} 从开战到现在的执行次数`;
      if (call.args.length === 2) return `${target} 从 t=${argText(call.args[1])} 到现在的执行次数`;
      return `${target} 在 t=${argText(call.args[1])} 到 t=${argText(call.args[2])} 之间的执行次数`;
    }
    case 'last-exec': {
      if (call.args.length === 0) return 'since 的布尔版（参数缺失）';
      const th = num(call.args[0], 0);
      const gt = !(call.args[1] && call.args[1].type === 'bool' && call.args[1].value === false);
      const target = call.args.length > 2 ? refArg(call.args[2]) : '本动作';
      return `${target} 距上次执行的时间${gt ? '超过' : '不足'} ${th} 秒（若从未执行过，结果直接取 ${gt ? 'true' : 'false'}）`;
    }
    case 'last-check': return '距上次战斗结束检查的秒数';
    case 'q-ready': {
      if (call.args.length === 0) return '本动作所属角色的元素爆发已就绪（OCR 识别）';
      return `角色「${call.args[0].name || argText(call.args[0])}」的元素爆发已就绪`;
    }
    case 'e-ready': {
      if (call.args.length === 0) return '本动作所属角色的元素战技已就绪（CD 记录推算）';
      return `角色「${call.args[0].name || argText(call.args[0])}」的元素战技已就绪`;
    }
    case 'e-cd': {
      if (call.args.length === 0) return '本动作所属角色的元素战技剩余冷却秒数';
      return `角色「${call.args[0].name || argText(call.args[0])}」的元素战技剩余冷却秒数`;
    }
    case 'low-hp': return '当前出战角色处于低血量';
    case 'onfield': return '本动作所属角色已经在场上';
    case 'in-party': return call.args.length === 0 ? '某个角色是否在队伍中（参数缺失）' : `角色「${call.args[0].name ? call.args[0].name : argText(call.args[0])}」在队伍中`;
    case 'min': return `取最小值：${call.args.map(argText).join('、')}`;
    case 'max': return `取最大值：${call.args.map(argText).join('、')}`;
    default: return fn.cn;
  }
}

function condExplainOpText(op) {
  return { '||': '或', '&&': '且', '>': '大于', '<': '小于', '=': '等于', '+': '加', '-': '减', '*': '乘', '/': '除', '!': '非' }[op] || op;
}

/** 生成中文释义（尽量使用自然语言）；传 opts 时动作引用会渲染成带悬停提示的动作名 */
function condExplain(node, opts) {
  if (!node) return '';
  switch (node.type) {
    case 'number': return String(node.value);
    case 'bool': return node.value ? '恒真' : '恒假';
    case 'ident': {
      if (COND_FUNCTION_SET.has(node.lower)) return condExplainFunction({ lower: node.lower, name: node.name, args: [] }, opts);
      return `动作「${node.name}」（注意：动作名不能直接当条件用，必须放进 since/count/last-exec 等函数里）`;
    }
    case 'call': return condExplainFunction(node, opts);
    case 'unary':
      return node.op === '!' ? `非（${condExplain(node.operand, opts)}）` : `负的（${condExplain(node.operand, opts)}）`;
    case 'binary': {
      const op = node.op;
      if (op === '&&') return `${wrap(node.left)} 并且 ${wrap(node.right)}`;
      if (op === '||') return `${wrap(node.left)} 或者 ${wrap(node.right)}`;
      return `${wrap(node.left)} ${condExplainOpText(op)} ${wrap(node.right)}`;
    }
    default: return '';
  }
  function wrap(n) {
    if (n.type === 'binary' && (n.op === '&&' || n.op === '||')) return `（${condExplain(n, opts)}）`;
    return condExplain(n, opts);
  }
}

/** 运算顺序预览：按求值优先级缩进打印（带 opts 时输出 HTML，否则纯文本） */
function condPrettyTree(node, depth = 0, opts) {
  const pad = '  '.repeat(depth);
  if (!node) return '';
  switch (node.type) {
    case 'binary': {
      const label = node.op === '&&' ? '&& 且（左右都真才为真）' : node.op === '||' ? '|| 或（任一边为真即为真）' : `${node.op} ${condExplainOpText(node.op)}`;
      return `${pad}${label}\n${condPrettyTree(node.left, depth + 1, opts)}\n${condPrettyTree(node.right, depth + 1, opts)}`;
    }
    case 'unary':
      return `${pad}${node.op} ${condExplainOpText(node.op)}\n${condPrettyTree(node.operand, depth + 1, opts)}`;
    case 'call':
      return `${pad}函数 ${node.name}() — ${condExplainFunction(node, opts)}\n` + node.args.map(a => condPrettyTree(a, depth + 1, opts)).join('\n');
    case 'ident':
      return `${pad}${node.name}`;
    case 'number':
      return `${pad}${node.value}`;
    case 'bool':
      return `${pad}${node.value}`;
    default:
      return pad + '?';
  }
}

/* ---------------- 引用重写 ---------------- */

/** 收集表达式里引用的 index 数字与未加括号的动作名 */
function condCollectRefs(node, out) {
  out = out || { indexes: [], names: [] };
  condWalk(node, (n) => {
    if (n.type === 'call' && ['since', 'count', 'last-exec'].includes(n.lower)) {
      if (n.lower === 'last-exec') {
        if (n.args.length > 2 && n.args[2].type === 'number') out.indexes.push(n.args[2]);
        else if (n.args.length > 2 && n.args[2].type === 'ident') out.names.push(n.args[2].name);
      } else if (n.args.length > 0) {
        if (n.args[0].type === 'number') out.indexes.push(n.args[0]);
        else if (n.args[0].type === 'ident') out.names.push(n.args[0].name);
      }
    }
  });
  return out;
}

/** 按 indexMap（old → new）重写表达式中的数字引用，返回 { text, changed } */
function condRewriteIndexes(node, indexMap) {
  const clone = condDeepClone(node);
  let changed = false;
  condWalk(clone, (n) => {
    if (n.type !== 'call') return;
    const slot = n.lower === 'last-exec' ? 2 : 0;
    if (!['since', 'count', 'last-exec'].includes(n.lower)) return;
    const a = n.args[slot];
    if (a && a.type === 'number' && indexMap.has(a.value)) { a.value = indexMap.get(a.value); changed = true; }
  });
  return { ast: clone, changed };
}

/* ---------------- 语义校验 ---------------- */

/**
 * 校验条件表达式
 * opts: { actionNames: [], currentAction: {name, character}, knownIndexes: Set }
 * 返回 { errors: [], warnings: [] }
 */
function condValidate(text, opts) {
  const errors = [];
  const warnings = [];
  const o = opts || {};
  const trimmed = (text || '').trim();
  if (trimmed === '') return { errors, warnings, ast: null };

  const parsed = condParse(trimmed, o.actionNames || []);
  if (parsed.error) { errors.push(parsed.error); return { errors, warnings, ast: null }; }
  const ast = parsed.ast;

  // 收集“处于函数实参位置”的节点：q-ready(芙宁娜) / since(芙芙e) 里的裸标识符是合法的
  const argNodes = new Set();
  condWalk(ast, (n) => {
    if (n.type === 'call') for (const a of n.args) argNodes.add(a);
    if (n.type === 'unary') argNodes.add(n.operand);
  });

  condWalk(ast, (n) => {
    if (n.type === 'ident') {
      if (argNodes.has(n)) return; // 由外层函数校验负责
      if (COND_FUNCTION_SET.has(n.lower)) {
        const fn = COND_FUNCTION_BY_NAME.get(n.lower);
        if (fn.arity[0] > 0) errors.push(`函数 ${fn.name}() 需要至少 ${fn.arity[0]} 个参数，不能省略括号（可写成 ${fn.def}）`);
        return;
      }
      if (o.actionNames && o.actionNames.some(x => String(x).toLowerCase() === n.lower)) {
        errors.push(`动作名「${n.name}」不能单独作为条件使用，必须写进 since()/count()/last-exec() 里（例如 since(${n.name})>5）`);
      } else {
        errors.push(`未知的条件函数或变量「${n.name}」：该表达式求值时会失败并被当作 false（动作将永不触发）`);
      }
      return;
    }
    if (n.type === 'call') {
      const fn = COND_FUNCTION_BY_NAME.get(n.lower);
      if (!fn) {
        if (o.actionNames && o.actionNames.some(x => String(x).toLowerCase() === n.lower)) {
          errors.push(`不能把动作名「${n.name}」当函数调用；引用动作请用 since(${n.name}) / count(${n.name}) / last-exec(5,true,${n.name})`);
        } else {
          errors.push(`未知条件函数「${n.name}」（内置函数共 ${COND_FUNCTION_NAMES.length} 个）`);
        }
        return;
      }
      const cnt = n.args.length;
      if (cnt < fn.arity[0] || cnt > fn.arity[1]) {
        errors.push(`函数 ${fn.name}() 参数个数不对：应为 ${fn.arity[0]}~${fn.arity[1]} 个，当前 ${cnt} 个`);
      }
      if (fn.name === 'in-party') {
        if (!n.args[0] || n.args[0].type !== 'ident') errors.push('in-party() 的参数必须是裸角色名（例如 in-party(芙宁娜)）');
      }
      if (['q-ready', 'e-ready', 'e-cd'].includes(fn.name) && n.args.length === 1) {
        const a = n.args[0];
        if (a.type !== 'ident') warnings.push(`${fn.name}() 的角色参数建议写成裸角色名（如 ${fn.name}(芙宁娜)），否则可能取不到目标角色`);
      }
      if (fn.name === 'last-exec' && n.args.length > 1 && n.args[1].type !== 'bool') {
        warnings.push('last-exec() 的第二个参数必须是字面量 true/false，否则会被静默当作 true');
      }
      if (['since', 'count', 'last-exec'].includes(fn.name)) {
        const slot = fn.name === 'last-exec' ? 2 : 0;
        const a = n.args[slot];
        if (a) {
          if (a.type === 'ident' && o.actionNames && !o.actionNames.some(x => String(x).toLowerCase() === a.lower)) {
            errors.push(`引用了不存在的动作名「${a.name}」（动作名必须与本策略中已声明的 name 完全一致，拼错会让条件恒为 false）`);
          }
          if (a.type === 'number' && o.knownIndexes && !o.knownIndexes.has(a.value)) {
            warnings.push(`引用了 index=${a.value}，但本策略中不存在该编号的动作`);
          }
        }
      }
      if (fn.name === 'q-ready' && n.args.length === 0 && !o.currentAction?.character) {
        warnings.push('通用动作（character 为空）里的 q-ready 会退化为“队伍中任意角色 Q 就绪”，不一定是你想要的效果');
      }
      if (fn.name === 'e-ready' && n.args.length === 0 && !o.currentAction?.character) {
        warnings.push('通用动作（character 为空）里的 e-ready 恒为 false');
      }
      if (fn.name === 'onfield' && !o.currentAction?.character) {
        warnings.push('通用动作（character 为空）里的 onfield() 恒为 false');
      }
    }
    if (n.type === 'bool' && n.raw && n.raw !== (n.value ? 'true' : 'false')) {
      errors.push(`布尔字面量必须小写：写 ${n.raw} 会被当成零参数函数，条件恒为 false（应写 ${n.value ? 'true' : 'false'}）`);
    }
  });

  return { errors, warnings, ast };
}

/** 顶层是否恒真/恒假（用于提示） */
function condConstValue(ast) {
  if (!ast) return null;
  if (ast.type === 'bool') return ast.value;
  if (ast.type === 'number') return ast.value > 0;
  return null;
}

/* ---------------- 隐式转换检查（数值 ↔ 布尔） ----------------
 * BetterGI 的表达式求值里，布尔与数值之间会发生隐式转换（true↔1、false↔0），
 * 写错参数类型不会报错，只会算出与预期不符的结果。这里只做“按位置推断类型”的检查，
 * 正常校验（condValidate）不会输出这类提示。
 */

/** 词法层把多段名合并成了单个 ident 节点，这里按“原子”把连续 ident 重新拼起来（如 since 芙芙e → since(芙芙e)） */
function condRenderAtoms(node, names) {
  if (!node) return '';
  if (node.type === 'ident' && !COND_FUNCTION_SET.has(node.lower)
    && names && names.some(n => String(n).toLowerCase() === node.lower)) return node.name;
  if (node.type === 'ident') return `${node.name}()`;
  if (node.type === 'call') return `${node.name}(${node.args.map(a => condRenderAtoms(a, names)).join(',')})`;
  if (node.type === 'binary') {
    if (node.op === '&&' || node.op === '||') return `${condRenderAtoms(node.left, names)} ${node.op} ${condRenderAtoms(node.right, names)}`;
    if (['+', '-', '*', '/'].includes(node.op)) {
      // 空格连接的两个 ident 是词法合并的产物（since 芙芙e）→ 还原成函数调用
      if (node.left.type === 'ident' && node.right.type === 'ident'
        && !COND_FUNCTION_SET.has(node.left.lower) && !COND_FUNCTION_SET.has(node.right.lower)) {
        return `${condRenderAtoms(node.left, names)}(${condRenderAtoms(node.right, names)})`;
      }
      const lp = (x) => condRenderAtoms(x, names);
      return `${lp(node.left)} ${node.op} ${lp(node.right)}`;
    }
    return `${condRenderAtoms(node.left, names)} ${node.op} ${condRenderAtoms(node.right, names)}`;
  }
  if (node.type === 'unary') {
    // 与 condToText 同理：`!` 作用于二元表达式时必须补括号，否则渲染出来的文本会换语义
    if (node.op === '!') return node.operand.type === 'binary'
      ? `!(${condRenderAtoms(node.operand, names)})`
      : `!${condRenderAtoms(node.operand, names)}`;
    if (node.operand.type === 'binary' || node.operand.type === 'unary') return `-(${condRenderAtoms(node.operand, names)})`;
    return `-${condRenderAtoms(node.operand, names)}`;
  }
  if (node.type === 'number') return String(node.value);
  if (node.type === 'bool') return node.value ? 'true' : 'false';
  return '';
}

/** 各函数的参数类型期望：'num' 数值 / 'bool' 布尔 / 'any' 不做判断；索引从 0 开始 */
const COND_ARG_EXPECT = {
  'battle-time': ['num', 'bool'],
  'since': ['num'],
  'count': ['num', 'num', 'num'],
  'last-exec': ['num', 'bool', 'num'],
  'q-ready': ['any'],
  'e-ready': ['any'],
  'e-cd': ['any'],
  'in-party': ['any'],
  'min': ['num'],
  'max': ['num'],
};

/** 内置函数的返回类型（COND_FUNCTIONS 里写的是 'number'，这里统一成 'num' 便于比较） */
function condFnReturn(fn) {
  if (!fn) return 'any';
  return fn.ret === 'number' ? 'num' : fn.ret;
}

/** 推断表达式片段的类型：'num' | 'bool' | 'any' */
function condExprType(node, names) {
  if (!node) return 'any';
  switch (node.type) {
    case 'number': return 'num';
    case 'bool': return 'bool';
    case 'ident': {
      const fn = COND_FUNCTION_BY_NAME.get(node.lower);
      if (fn) return condFnReturn(fn);
      if (names && names.some(n => String(n).toLowerCase() === node.lower)) return 'any';
      return 'any';
    }
    case 'call': {
      const fn = COND_FUNCTION_BY_NAME.get(node.lower);
      return fn ? condFnReturn(fn) : 'any';
    }
    case 'unary': return node.op === '!' ? 'bool' : 'num';
    case 'binary': {
      if (['&&', '||', '>', '<', '='].includes(node.op)) return 'bool';
      if (['+', '-', '*', '/'].includes(node.op)) return 'num';
      return 'any';
    }
    default: return 'any';
  }
}

/**
 * 收集表达式中的隐式转换位置
 * 返回 [{ text, reason }]，text 为该位置的表达式片段
 */
function condCollectConversions(ast, actionNames) {
  const names = actionNames || [];
  const out = [];
  const seen = new Set();
  const push = (node, reason) => {
    const text = condRenderAtoms(node, names) || '(空)';
    const key = text + '|' + reason;
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ text, reason });
  };
  const check = (node, need) => {
    if (!node) return;
    const got = condExprType(node, names);
    if (got !== 'any' && got !== need) {
      const conv = (got === 'num' && need === 'bool')
        ? '这里需要布尔值，实际是数值 —— 求值时数值会按“大于 0 即为真”转成布尔'
        : '这里需要数值，实际是布尔值 —— 求值时 true/false 会被当作 1/0';
      push(node, conv);
    }
  };

  const walk = (node, need) => {
    if (!node) return;
    check(node, need);
    if (node.type === 'binary') {
      const op = node.op;
      if (op === '&&' || op === '||') {
        walk(node.left, 'bool'); walk(node.right, 'bool');
      } else if (op === '>' || op === '<' || op === '=') {
        walk(node.left, 'num'); walk(node.right, 'num');
      } else {
        walk(node.left, 'num'); walk(node.right, 'num');
      }
      return;
    }
    if (node.type === 'unary') {
      walk(node.operand, node.op === '!' ? 'bool' : 'num');
      return;
    }
    if (node.type === 'call') {
      const exp = COND_ARG_EXPECT[node.lower] || [];
      node.args.forEach((a, i) => {
        const want = exp[i] || exp[exp.length - 1] || 'num';
        if (want === 'any') return;
        walk(a, want);
      });
    }
  };

  walk(ast, 'bool');
  return out;
}


/* ==================== core.js ==================== */
/* 核心：编号引擎、动作模型、priority 推导、指令解析、校验器 */

/* 动作类型 -> priority 分段的基准值（段 = [基准, 基准+9999]）。
 * 动作类型 0（战斗检查与标记）的编号只有 1~9，但它的段仍然是 0~9999，
 * 这样“次于战斗检查与标记”= 10000 正好等于“优先于开盾”，各段首尾相接不重叠。 */
const ACTION_CODE_BASE = { 0: 0, 1: 10000, 2: 20000, 3: 30000, 4: 40000, 5: 50000, 6: 60000, 7: 70000, 8: 80000, 9: 90000 };
const MAX_SLOT = 9;

/* ---------------- 角色表 ---------------- */

const AVATAR_BY_NAME = new Map(AVATARS.filter(a => !a.virtual).map(a => [a.name, a]));
const AVATAR_BY_INDEX = new Map(AVATARS.map(a => [a.code * 100 + a.seq, a]));
const ELEMENT_BY_CODE = new Map(ELEMENTS.map(e => [e.code, e]));

function getAvatar(name) { return AVATAR_BY_NAME.get(name) || null; }
function getElement(code) { return ELEMENT_BY_CODE.get(code) || ELEMENT_BY_CODE.get(0); }
function elementLabel(code) { const e = getElement(code); return e.code === 0 ? '元素未定' : e.name + '元素'; }
/** 检索次序键：元素号 * 100 + 角色编号 */
function avatarOrderKey(av) { return av.code * 100 + av.seq; }
function avatarCodeLabel(av) { return `${av.code}${String(av.seq).padStart(2, '0')}`; }

/* ---------------- 编号引擎 ---------------- */

function isCurrentAvatarName(name) { return !name; }

/** 生成动作 index */
function makeIndex(type, code, seq, slot) {
  return type * 10000 + code * 1000 + seq * 10 + slot;
}

/** 解析 index 的结构，返回 { ok, type, code, seq, slot, reason }。
 *  注意：动作类型是十进制首位（1 位），元素是第 2 位，角色是第 3~4 位，尾数是第 5 位。
 *  因此 index = 类型*10000 + 元素*1000 + 角色*10 + 尾数；类型 0 时只占尾数（1 位）。
 */
function parseIndex(index) {
  if (!Number.isInteger(index) || index < 0) return { ok: false, reason: 'index 必须是非负整数' };
  if (index > 99999) return { ok: false, reason: 'index 不应超过 99999（动作类型 9 / 元素 9 已超出元素表范围）' };
  // 动作类型 0（战斗检查与标记）只用于「当前角色」，编号只剩尾数 1 位：index = 1~9
  // （它的首位数字同时也是尾数，因此无法与「类型 9」区分；按规则约定 10 以下一律视为类型 0）
  if (index < 10) {
    if (index < 1) return { ok: false, type: 0, reason: `动作类型 0 的 index 只能是 1~${MAX_SLOT}（战斗检查与标记只用于「当前角色」）` };
    return { ok: true, type: 0, code: 0, seq: 0, slot: index };
  }
  if (index < 10000) {
    return { ok: false, reason: `index=${index} 位数不足：动作类型 0 以外的动作编号必须是 5 位数（类型+元素+角色2位+尾数），例如 11111` };
  }
  const s = String(index);
  const type = Number(s[0]);
  const rest = s.slice(1).padStart(4, '0');
  const code = Number(rest[0]);
  const seq = Number(rest.slice(1, 3));
  const slot = Number(rest[3]);
  if (code > 7) return { ok: false, type, code, seq, slot, reason: `第 2 位（元素类型）只能是 0~7，当前 index 的第 2 位是 ${code}` };
  if (slot === 0) return { ok: false, type, code, seq, slot, reason: '第 5 位不能为 0（0 是预留给「额外优先级插入位」的，只允许出现在 morePriorities 的 priority 里）' };
  if (code === 0 && seq === 0) return { ok: true, type, code, seq, slot }; // 当前角色
  const av = AVATAR_BY_INDEX.get(code * 100 + seq);
  if (!av) return { ok: false, type, code, seq, slot, reason: `编号 ${code}${String(seq).padStart(2, '0')} 不对应任何角色` };
  return { ok: true, type, code, seq, slot, avatar: av };
}

function indexDisplay(index) {
  const pi = parseIndex(index);
  if (!pi.ok && pi.type === undefined) return '编号不符合规则';
  return `类型${pi.type} · 元素${pi.code} · 角色${String(pi.seq).padStart(2, '0')} · 尾${pi.slot}`;
}

/* ---------------- 动作模型 ---------------- */

let _idSeq = 1;
function newId() { return 'a' + (_idSeq++); }

function createAction(opts = {}) {
  const type = opts.type ?? 1;
  const character = type === 0 ? '' : (opts.character ?? '');
  const a = {
    id: newId(),
    name: opts.name || '',
    character,
    type,
    action: opts.action ?? '',
    ensureCast: opts.ensureCast ?? (type === 1),
    conditionText: opts.conditionText ?? '',
    conditionMode: 'all',
    conditionCacheFor: null,
    // 队友条件：include/exclude 允许同一个角色出现多次（多个「角色组合」里出现同一角色很正常），
    // includeOps / excludeOps 是「项与项之间」的运算符（长度 = 项数 - 1），mode 是未单独指定时的默认值。
    // 新增角色项前的运算符默认用「或」。
    teammates: { include: [], includeOps: [], exclude: [], excludeOps: [], mode: opts.teammatesMode ?? 'or', autoExclude: [], autoExcludeSameType: opts.type === 0 ? false : true },
    morePriorities: [],
    slot: 0,
    index: 0,
    manualIndex: false,
    enabled: true,
    // tags：专用于保存用户对该动作节点的注释。BetterGI 的动作节点里没有这个属性，
    // 但 Newtonsoft.Json 默认忽略未知属性（MissingMemberHandling.Ignore），所以可以安全地用它存注释。
    tags: opts.tags ?? '',
  };
  return a;
}

function setConditionText(act, text) {
  act.conditionText = text ?? '';
  act.conditionCacheFor = null;
  const parsed = condParse(act.conditionText, allActionNames(state.strategy.actions));
  act.conditionAst = parsed.error ? null : parsed.ast;
  return parsed;
}

/** 条件构造器 -> 表达式文本 */
function buildCondExpr(rows, mode) {
  const parts = (rows || []).map(r => {
    const t = (r.text || '').trim();
    if (!t) return null;
    return t;
  }).filter(Boolean);
  if (!parts.length) return '';
  if (parts.length === 1) return parts[0];
  const op = mode === 'any' ? ' || ' : ' && ';
  const needParen = (s) => (mode === 'all' ? /\|\|/.test(s) : /&&/.test(s));
  return parts.map(p => (needParen(p) ? `(${p})` : p)).join(op);
}

/** 表达式文本 -> 条件构造器行 */
function parseCondRows(text) {
  const parsed = condParse(text || '', allActionNames(state.strategy.actions));
  if (parsed.error) return null;
  const rows = [];
  let mode = 'all';
  const root = parsed.ast;
  if (!root) return { rows: [], mode: 'all', constant: false };
  if (root.type === 'binary' && (root.op === '&&' || root.op === '||')) {
    mode = root.op === '&&' ? 'all' : 'any';
    const stack = [root];
    while (stack.length) {
      const n = stack.shift();
      if (n.type === 'binary' && n.op === root.op) { stack.unshift(n.left); stack.unshift(n.right); }
      else rows.push({ text: condToText(n), id: newId() });
    }
  } else if (root.type === 'bool') {
    return { rows: [], mode: 'all', constant: true, ast: root };
  } else {
    rows.push({ text: condToText(root), id: newId() });
  }
  return { rows, mode, ast: root };
}

function allActionNames(actions) {
  return (actions || []).map(a => a.name).filter(n => n && n.trim());
}
function knownIndexes(actions) {
  return new Set((actions || []).map(a => a.index));
}

/**
 * 找出「哪些动作的条件表达式里引用了目标动作」，用于动作卡片里「编号（自动）」下面那行注释。
 * 覆盖入参为动作的条件函数（since / count / last-exec）的两种写法：
 *   · 数字入参等于目标动作的 index；
 *   · 名称入参（标识符）等于目标动作的 name（大小写不敏感，与 BetterGI 的匹配方式一致）。
 * 主条件与全部其他触发条件都会检查。返回 [{ action, via: 'index'|'name' }]。
 */
function findActionReferrers(actions, target) {
  const out = [];
  if (!target) return out;
  const name = String(target.name || '').toLowerCase();
  for (const a of (actions || [])) {
    if (a.id === target.id) continue;
    const texts = [a.conditionText || '', ...(a.morePriorities || []).map(mp => mp.text || '')];
    let via = null;
    for (const t of texts) {
      if (!String(t).trim()) continue;
      const p = condParse(t, allActionNames(actions));
      if (p.error || !p.ast) continue;
      const refs = condCollectRefs(p.ast, { indexes: [], names: [] });
      if (refs.indexes.some(n => n && n.value === target.index)) { via = 'index'; break; }
      if (name && refs.names.some(n => String(n).toLowerCase() === name)) { via = 'name'; break; }
    }
    if (via) out.push({ action: a, via });
  }
  return out;
}

/** 角色下的动作分组（按类型） */
function actionsOf(actions, character) {
  return actions.filter(a => (a.character || '') === (character || ''));
}
function slotTaken(actions, character, type, slot, exceptId) {
  return actions.some(a => (a.character || '') === (character || '') && a.type === type && a.slot === slot && a.id !== exceptId);
}
function nextFreeSlot(actions, character, type, exceptId) {
  for (let s = 1; s <= MAX_SLOT; s++) if (!slotTaken(actions, character, type, s, exceptId)) return s;
  return 0;
}
function countOfType(actions, character, type) {
  return actions.filter(a => (a.character || '') === (character || '') && a.type === type).length;
}

/** 重算所有动作的 index（type/character/slot 已确定） */
function recomputeIndexes(actions) {
  for (const a of actions) {
    if (a.manualIndex && Number.isInteger(a.index)) continue;
    const av = a.character ? getAvatar(a.character) : { code: 0, seq: 0 };
    const code = av ? av.code : 0;
    const seq = av ? av.seq : 0;
    a.index = makeIndex(a.type, code, seq, a.slot || 1);
  }
}

/** 为某角色/类型分配一个可用的 slot，失败返回 0 */
function allocateSlot(actions, character, type, exceptId) {
  return nextFreeSlot(actions, character, type, exceptId);
}

/**
 * 新增动作：容量检查（同角色同类型最多 9 条）
 * 返回 { ok, action, error }
 */
function addAction(character, type, opts = {}) {
  const actions = state.strategy.actions;
  if (type === 0 && character) return { ok: false, error: '动作类型 0（战斗检查与标记）只能添加到「当前角色」下' };
  if (countOfType(actions, character, type) >= MAX_SLOT) {
    return {
      ok: false,
      error: `「${character || '当前角色'}」的「${actionTypeName(type)}」动作已达上限 ${MAX_SLOT} 条，无法继续新增。请删除该类型下的某条动作，或把某条动作改成别的动作类型。`
    };
  }
  const slot = allocateSlot(actions, character, type);
  if (!slot) return { ok: false, error: `「${character || '当前角色'}」的「${actionTypeName(type)}」动作序号 1~${MAX_SLOT} 已全部被占用` };
  const act = createAction({ ...opts, type, character });
  act.slot = slot;
  recomputeIndexes([act]);
  actions.push(act);
  return { ok: true, action: act };
}

/** 删除动作 */
function removeAction(id) {
  const actions = state.strategy.actions;
  const i = actions.findIndex(a => a.id === id);
  if (i >= 0) actions.splice(i, 1);
}

/** 切换动作类型：需要重新分配 slot */
function changeActionType(id, newType) {
  const actions = state.strategy.actions;
  const act = actions.find(a => a.id === id);
  if (!act) return { ok: false, error: '动作不存在' };
  if (newType === act.type) return { ok: true };
  if (newType === 0 && act.character) {
    return { ok: false, error: '动作类型 0（战斗检查与标记）只能用于「当前角色」。请先把该动作的角色改为「当前角色」。' };
  }
  if (countOfType(actions, act.character, newType) >= MAX_SLOT) {
    return {
      ok: false,
      error: `「${act.character || '当前角色'}」的「${actionTypeName(newType)}」动作已达上限 ${MAX_SLOT} 条，无法转入。请先删除该类型下的某条动作，或改用其他动作类型。`
    };
  }
  const slot = allocateSlot(actions, act.character, newType);
  if (!slot) return { ok: false, error: `「${actionTypeName(newType)}」的序号 1~${MAX_SLOT} 已全部被占用，无法转入` };
  act.type = newType;
  act.slot = slot;
  act.manualIndex = false;
  if (newType === 1 && act.ensureCast === false) act.ensureCast = true; // 开盾默认勾选
  recomputeIndexes(actions);
  return { ok: true };
}

/** 同类型内与相邻动作交换顺序（交换第 5 位） */
function swapActionOrder(id, dir) {
  const actions = state.strategy.actions;
  const act = actions.find(a => a.id === id);
  if (!act) return { ok: false, error: '动作不存在' };
  const siblings = actions.filter(a => (a.character || '') === (act.character || '') && a.type === act.type)
    .sort((x, y) => (x.index - y.index) || (actions.indexOf(x) - actions.indexOf(y)));
  const i = siblings.findIndex(a => a.id === id);
  const j = i + (dir < 0 ? -1 : 1);
  if (j < 0 || j >= siblings.length) {
    return { ok: false, error: dir < 0 ? '已经是该类型中 index 最小的动作，无法再上移' : '已经是该类型中 index 最大的动作，无法再下移' };
  }
  const other = siblings[j];
  const s1 = act.slot, s2 = other.slot;
  act.slot = s2; other.slot = s1;
  act.manualIndex = false; other.manualIndex = false;
  act.indexViolation = false; other.indexViolation = false;
  recomputeIndexes(actions);
  // 保证声明顺序与 index 顺序一致，避免 priority 并列时先检查错的动作
  const i1 = actions.indexOf(act), i2 = actions.indexOf(other);
  if (i1 >= 0 && i2 >= 0) {
    const lo = Math.min(i1, i2), hi = Math.max(i1, i2);
    const first = dir > 0 ? other : act;
    const second = dir > 0 ? act : other;
    actions.splice(lo, 2, first, second);
  }
  return { ok: true };
}

/** 把一个动作移动到指定 slot（0 表示插入位） */
function moveActionToSlot(id, slot) {
  const actions = state.strategy.actions;
  const act = actions.find(a => a.id === id);
  if (!act) return { ok: false, error: '动作不存在' };
  if (slot < 0 || slot > MAX_SLOT) return { ok: false, error: '尾数只能是 0~9' };
  if (slot !== 0 && slotTaken(actions, act.character, act.type, slot, act.id)) {
    return { ok: false, error: `尾数 ${slot} 已被同角色同类型的另一条动作占用，请改用其他尾数或先移走那条动作` };
  }
  act.slot = slot;
  act.manualIndex = false;
  recomputeIndexes(actions);
  return { ok: true };
}

/* ---------------- priority 推导 ---------------- */

/**
 * 判定优先级的取值范围（按十进制错位定位，与 index 结构一致）
 * scope: { type, element, character }
 * 返回 { min, max, lo, hi, label, empty }
 */
function priorityRange(scope) {
  const t = scope.type;
  if (t === null || t === undefined || t === '') return null;
  const base = ACTION_CODE_BASE[t];
  if (base === undefined) return null;
  // 动作类型 0（战斗检查与标记）是一整段，不能再按元素/角色细分
  if (t === 0 && scope.element !== null && scope.element !== undefined && scope.element !== '') return null;
  let lo = base, hi = base + 9999, label = actionTypeName(t);
  if (scope.element !== null && scope.element !== undefined && scope.element !== '') {
    const e = Number(scope.element);
    if (e < 0 || e > 7) return null;
    lo = base + e * 1000;
    hi = lo + 999;
    label += ' / ' + elementLabel(e);
    if (scope.character) {
      const av = getAvatar(scope.character);
      if (!av) return null;
      if (av.code !== e) return null;
      const cLo = base + e * 1000 + av.seq * 10;
      lo = cLo; hi = cLo + 9;
      label += ' / ' + scope.character;
    }
  }
  return { lo, hi, min: lo, max: hi, label };
}

/** 按 scope 生成 [优先于, 次于) 的数值区间，用于各种“优先/次于某类动作”的选项 */
function prioritySpan(scope) {
  const r = priorityRange(scope);
  if (!r) return null;
  return { before: r.lo, after: r.hi + 1, label: r.label, lo: r.lo, hi: r.hi };
}

/** 计算 priority：before=段内最小值，after=段内最大值+1；段内无动作则用段边界 */
function computePriority(scope, cmp, actions) {
  const r = priorityRange(scope);
  if (!r) return null;
  const inRange = (actions || state.strategy.actions).filter(a => a.index >= r.lo && a.index <= r.hi).map(a => a.index);
  const empty = inRange.length === 0;
  if (cmp === 'before') return { priority: r.lo, empty, range: r };
  return { priority: r.hi + 1, empty, range: r };
}

/** 生成一段可读的 scope 描述 */
function scopeLabel(scope) {
  const r = priorityRange(scope);
  if (!r) return '（未完整选择）';
  return r.label;
}

/**
 * 找出与给定 priority 数值完全相等的所有「判定顺序 + 判定范围」候选，用于导入/读草稿时把数值还原成选择。
 * 同一个数值往往既能解释成「优先于某段」也能解释成「次于上一段」（例如 10000 = 优先于开盾 = 次于战斗检查与标记），
 * 按需求「优先选次于」；同为同一判定顺序时，判定范围越具体越优先。
 */
function priorityScopeCandidates(p) {
  const out = [];
  if (!Number.isInteger(p)) return out;
  const add = (level, scope, cmp) => out.push({ level, scope, cmp });
  for (let t = 0; t <= 9; t++) {
    const base = ACTION_CODE_BASE[t];
    if (p === base) add(3, { type: t, element: '', character: '' }, 'before');
    if (p === base + 10000) add(3, { type: t, element: '', character: '' }, 'after');
    if (t === 0) continue;                    // 类型 0 是一整段，不能再按元素/角色细分
    for (let e = 1; e <= 7; e++) {
      const lo = base + e * 1000;
      if (p === lo) add(2, { type: t, element: e, character: '' }, 'before');
      if (p === lo + 1000) add(2, { type: t, element: e, character: '' }, 'after');
    }
  }
  for (const av of AVATARS) {
    if (av.virtual || !av.code || av.code > 7) continue;
    for (let t = 1; t <= 9; t++) {
      const lo = ACTION_CODE_BASE[t] + av.code * 1000 + av.seq * 10;
      if (p === lo) add(1, { type: t, element: av.code, character: av.name }, 'before');
      if (p === lo + 10) add(1, { type: t, element: av.code, character: av.name }, 'after');
    }
  }
  out.sort((a, b) => (a.cmp === b.cmp ? a.level - b.level : (a.cmp === 'after' ? -1 : 1)));
  return out;
}

/** 把 priority 数值还原成选择；还原不了时返回 null（保留手工数值） */
function priorityScopeFromNumber(p) {
  const cand = priorityScopeCandidates(p)[0];
  if (!cand) return null;
  return { scope: cand.scope, cmp: cand.cmp };
}

function actionTypeName(t) {
  const x = ACTION_TYPES.find(a => a.code === t);
  return x ? x.name : `类型${t}`;
}
function actionTypeShort(t) {
  const x = ACTION_TYPES.find(a => a.code === t);
  return x ? x.short : `T${t}`;
}

/* ---------------- 指令串解析与校验 ---------------- */

/** 按顶层逗号切分指令串（自动合并括号内的逗号） */
function splitCommandString(str) {
  const out = [];
  let buf = '';
  let depth = 0;
  for (const ch of str) {
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (ch === ',' && depth <= 0) { out.push(buf); buf = ''; continue; }
    buf += ch;
  }
  out.push(buf);
  return out.map(s => s.trim()).filter(s => s !== '');
}

/**
 * 解析单条指令 token：{ raw, method, args }
 * 返回 { text, errors: [], method }
 */
function parseCommand(token, opts = {}) {
  const raw = token.trim();
  const errors = [];
  if (raw === '') return { raw, method: null, errors: ['空指令'] };
  if (/[（）]/.test(raw)) errors.push('指令中出现了中文括号，必须使用半角 ( )');
  if (/[，；]/.test(raw)) errors.push('指令中出现了中文逗号/分号，必须使用半角 , 分隔');
  const open = (raw.match(/\(/g) || []).length;
  const close = (raw.match(/\)/g) || []).length;
  if (open !== close) errors.push('括号不配对');
  if (open > 1) errors.push('一条指令中出现了多个 (（请检查是否漏了逗号）');

  const m = raw.match(/^([^()]*?)\s*(?:\((.*)\))?$/);
  const name = (m && m[1] ? m[1] : raw).trim();
  const argsRaw = m && m[2] !== undefined ? m[2] : null;
  const method = METHOD_BY_ALIAS.get(name) || null;
  if (!method) {
    errors.push(`未知指令「${name}」：BetterGI 会抛出「战斗策略脚本中出现未知的方法」。注意别名区分大小写（'普攻' 合法，'attack' 合法，'E' 不合法，应为 'e'）`);
    return { raw, method: null, name, args: [], errors };
  }
  if (method.cat === '不可用') errors.push(`指令「${name}」不可用：${method.cn}`);

  const args = argsRaw === null || argsRaw.trim() === '' ? [] : argsRaw.split(',').map(s => s.trim());
  if (argsRaw !== null && argsRaw.trim() === '' && method.argKind !== 'none' && method.argKind !== 'flagset') {
    // 允许空括号，例如 q()，等价无参
  }

  const needNum = (v, label, { integer = false, positive = false } = {}) => {
    if (v === '' || v === undefined) return `${label}不能为空`;
    if (!/^-?\d+(\.\d+)?$/.test(v)) return `${label}必须是数字（当前为「${v}」）`;
    if (integer && !/^-?\d+$/.test(v)) return `${label}必须是整数（当前为「${v}」）`;
    if (positive && Number(v) <= 0) return `${label}必须大于 0`;
    return null;
  };

  switch (method.argKind) {
    case 'none': {
      const max = method.maxArgs ?? 0;
      if (args.length > max) errors.push(`指令 ${method.canonical} 最多接受 ${max} 个参数，当前给了 ${args.length} 个`);
      if (max >= 1 && args.length === 1) { const e = needNum(args[0], '参数'); if (e) errors.push(e); }
      break;
    }
    case 'seconds': {
      if (args.length > 1) errors.push(`指令 ${method.canonical} 最多接受 1 个参数（秒数）`);
      if (method.required && args.length === 0) errors.push(`指令 ${method.canonical} 必须带一个秒数参数，例如 ${method.canonical}(0.2)`);
      if (args.length === 1) { const e = needNum(args[0], '秒数', { positive: method.canonical === 'walk' }); if (e) errors.push(e); }
      break;
    }
    case 'flagset': {
      for (const a of args) if (!(method.flags || []).includes(a)) errors.push(`指令 ${method.canonical} 不支持参数「${a}」，可用参数：${(method.flags || []).join(' / ')}`);
      break;
    }
    case 'walk': {
      if (args.length !== 2) errors.push('walk 必须有两个参数：方向 + 秒数，例如 walk(s,0.2)');
      else {
        if (!['w', 'a', 's', 'd'].includes(args[0])) errors.push(`walk 的方向只能是 w / a / s / d，当前为「${args[0]}」`);
        const e = needNum(args[1], '行走时间', { positive: true }); if (e) errors.push(e);
      }
      break;
    }
    case 'twodouble': {
      if (args.length !== 2) errors.push('moveby 必须有两个参数：横向像素 + 纵向像素，例如 moveby(100,100)');
      else { const a = needNum(args[0], '横向像素', { integer: true }); if (a) errors.push(a); const b = needNum(args[1], '纵向像素', { integer: true }); if (b) errors.push(b); }
      break;
    }
    case 'int': {
      if (args.length !== 1) errors.push('scroll 必须有一个整数参数，例如 scroll(10) 或 scroll(-1)');
      else { const e = needNum(args[0], '滚动格数', { integer: true }); if (e) errors.push(e); }
      break;
    }
    case 'mouse': {
      if (args.length > 1) errors.push(`${method.canonical} 最多一个参数（left / right / middle）`);
      if (args.length === 1 && !['left', 'right', 'middle'].includes(args[0])) errors.push(`${method.canonical} 的参数只能是 left / right / middle（小写），当前为「${args[0]}」`);
      break;
    }
    case 'key': {
      if (args.length !== 1) errors.push(`${method.canonical} 必须有一个按键参数，例如 ${method.canonical}(VK_E)`);
      else if (!VK_SET.has(args[0].toUpperCase())) errors.push(`「${args[0]}」不是合法的虚拟键名。可用形如 VK_E / E / VK_SPACE 的写法（BetterGI 内部会转大写并补 VK_ 前缀）`);
      if (args.length === 1 && /^VK_[LRMX]BUTTON/i.test(args[0]) && args[0] !== args[0].toUpperCase()) {
        errors.push(`鼠标键必须写全大写（如 VK_LBUTTON）：BetterGI 内部 switch 区分大小写，写错会静默退化成普通键盘按键`);
      }
      break;
    }
    default: break;
  }

  if (args.length === 1 && args[0] === '' && !['none'].includes(method.argKind)) errors.push('参数不能为空');
  return { raw, method, name, args, errors };
}

/** 指令串里的按键名归一化（BetterGI 内部会把参数转大写并补 VK_ 前缀） */
function normVkName(a) {
  const s = String(a === undefined || a === null ? '' : a).trim();
  return s ? s.toUpperCase().replace(/^VK_/, '') : '';
}

/**
 * 找出「按下了却没有松开」的按键：同一条指令串里出现了 keydown(某按键) 却没有对应的 keyup(同一按键)。
 * 这种残留会让那个按键一直被按住（例如一直按着 e，之后连普攻都点不出来），所以只提示、不阻止导出。
 */
function findUnpairedKeydowns(parts) {
  const held = new Map();     // 归一化按键名 -> 原始的 keydown 指令原文
  const order = [];           // 保持出现顺序，提示更接近阅读顺序
  const released = new Set();
  for (const p of parts || []) {
    if (!p || !p.method) continue;
    const canon = p.method.canonical;
    if (canon !== 'keydown' && canon !== 'keyup') continue;
    const key = normVkName(p.args && p.args[0]);
    if (!key) continue;
    if (canon === 'keydown') {
      if (!held.has(key)) order.push(key);
      held.set(key, p.raw);
    } else {
      held.delete(key);
      released.add(key);
    }
  }
  return order.filter(k => held.has(k)).map(k => ({ key: k, raw: held.get(k), released: released.has(k) }));
}

/** 解析整条指令串 */
function parseActionString(str) {
  const tokens = splitCommandString(str || '');
  const parts = tokens.map(t => parseCommand(t));
  const errors = [];
  const warnings = [];
  for (const p of parts) for (const e of p.errors) errors.push(`指令「${p.raw}」：${e}`);
  if (/[|]/.test(str || '')) errors.push('指令串中出现了 | 分隔符：JSON 策略不支持（只有 .txt 策略和 preActions 才支持）');
  if (/[;]/.test(str || '')) errors.push('指令串中出现了 ; 分号：JSON 策略不支持，请改用半角逗号');
  if (/（|）/.test(str || '')) errors.push('指令串中出现了中文括号，必须使用半角 ( )');
  if (tokenHasRound(parts)) errors.push('指令串中出现了 round(...)：在 JSON 策略中它是空操作指令，不起回合分组作用');
  for (const u of findUnpairedKeydowns(parts)) {
    warnings.push(`指令「${u.raw}」按下了按键「${u.key}」，但整条指令串里没有对同一个按键的 keyup（${u.released ? '它只在松开别的按键时被顺带松开过' : '这条指令串里根本没出现松开它的指令'}）：这个按键可能会被一直按住，导致后续按键/普攻等操作失灵。请补一条 keyup(${u.key})，或改用「长按后松开按键」这类成对的写法`);
  }
  if (parts.length === 0) warnings.push('指令串为空：该动作执行时不会有任何操作');
  return { parts, errors, warnings };
}

function tokenHasRound(parts) {
  return parts.some(p => p.method && p.method.canonical === 'round');
}

/** 首个指令是否触发切人 */
function firstSwitchInfo(parts) {
  const first = parts[0];
  if (!first || !first.method) return { canSwitch: false, reason: '首个指令无法解析' };
  if (NO_SWITCH.has(first.method.canonical)) return { canSwitch: false, reason: `首个指令「${first.method.canonical}」属于宏/等待类指令，不会触发切人` };
  if (SWITCH_TRIGGERING.has(first.method.canonical)) return { canSwitch: true, method: first.method.canonical };
  return { canSwitch: false, reason: `首个指令「${first.method.canonical}」不在切人指令名单内` };
}

/** 指令串是否包含 e 技能相关指令（供 ensureCast 检查） */
function hasESkill(parts) {
  return parts.some(p => {
    if (!p.method) return false;
    if (p.method.canonical === 'e') return true;
    if (['keydown', 'keyup', 'keypress'].includes(p.method.canonical)) {
      return (p.args[0] || '').toUpperCase().replace(/^VK_/, '') === 'E';
    }
    return false;
  });
}

/* ---------------- 条件表达式组装 ----------------
 * 组装规则（与拆分规则一一对应，见 README）：
 *   1) 没有任何队友条件 → 触发条件原样写入 expression；
 *   2) 有队友条件 → 一律写成「(触发条件) && (队友条件)」，触发条件为空时用 true 占位。
 * 队友条件本身分三种结构：
 *   a) 只有必要队友：  (必要队友表达式)
 *   b) 还有排除队友：  (必要队友或true) && !(排除队友表达式)
 *   c) 还有自动排除：  (必要队友或true) && !(排除队友表达式或false) && (true) && (自动排除表达式)
 * 「排除队友」由用户按「角色组合」选择（项与项之间可以逐个选「与 / 或」），**内部一律不取非**：
 *   写出来的条件函数与运算符只有 in-party / && / ||，用户选的「与 / 或」原样出现在表达式里，
 *   等到组装队友条件时才把整段加括号后取非：
 *   组合「或」→ !(in-party(甲) || in-party(乙))，组合「与」→ !(in-party(甲) && in-party(乙))。
 *   这样用户选的运算符与表达式里出现的运算符完全一致，并且和「必要队友」一样可以用「或」切分
 *   「角色组合」，靠运算优先级实现对多个「角色组合」的精准选择。
 *   说明（别搞反）：BetterGI 的解析器（ConditionEvaluator）里 `!` 是一元运算符、优先级高于
 *   && / ||，括号里的表达式会先整体求值，所以 `!(甲 || 乙)` 与 `!甲 && !乙` 语义完全等价；
 *   这里统一写成 `!(…)`，拆回来时按「剥掉最外层的取非」还原成同一个「角色组合」。
 *   「排除队友」为空时括号里填 false，取非后正好是 true（= 视为满足）。
 * 结构 c) 里的 `(true)` 是恒等占位，同时充当**格式标记**：见到它就知道这份队友条件是本编辑器
 * 写出来的，其中的取非项才按「是否等于同角色某个动作的必要队友表达式」区分「自动排除」与
 * 「排除队友」；没有这个标记的旧格式表达式两者同形，一律按「排除队友」还原。
 */

/** 运算符取反（与 ⇄ 或）：还原「排除队友」时用得上（德摩根） */
function invertTeamOp(op) { return op === 'or' ? 'and' : 'or'; }
function normTeamOp(op, fallback) { return op === 'or' || op === 'and' ? op : (fallback === 'or' ? 'or' : 'and'); }

/**
 * 把 in-party 项组表达式（**不自动加外层括号**）。
 * items: [{ name, neg }]；ops 是「项与项之间」的运算符（'and'/'or'，与表达式里的 && / || 一致），
 * 项数与 ops 长度不匹配时用 fallback 兜底。
 * 调用方负责按需要套括号：嵌进队友条件时用 parenIfLogical，取非时用 `!( … )`。
 */
function joinInPartyItems(items, ops, fallback) {
  const list = (items || []).filter(x => x && x.name);
  if (!list.length) return '';
  const parts = list.map(x => `${x.neg ? '!' : ''}in-party(${x.name})`);
  let text = parts[0];
  for (let i = 1; i < list.length; i++) {
    const op = normTeamOp((ops || [])[i - 1], fallback);
    text += ` ${op === 'or' ? '||' : '&&'} ${parts[i]}`;
  }
  return text;
}

/** 「必要队友」表达式：组合运算符与表达式里的 && / || 一致（**不含最外层括号**，由 teammateExpr 按需补） */
function includeExprOf(tb) {
  const tm = tb || {};
  const mode = tm.mode === 'and' ? 'and' : 'or';
  return joinInPartyItems(
    (tm.include || []).filter(Boolean).map(n => ({ name: n, neg: false })),
    tm.includeOps, mode);
}
/** 「排除队友」（单个角色组合）那一段的表达式文本：**不含取非，也不加外层括号**；没有排除队友时返回 '' */
function excludeGroupTextOf(tb) {
  return excludeChainText(excludeGroupChainOf(tb));
}

/** 「排除队友」的「角色组合」（项 + 项间运算符）；没有排除队友时 items 为空 */
function excludeGroupChainOf(tb) {
  return { items: (tb && tb.exclude || []).filter(Boolean).map(n => ({ name: n, neg: false })), ops: padTeamOps(tb && tb.excludeOps, Math.max(0, (tb && tb.exclude || []).filter(Boolean).length - 1), 'or') };
}

/**
 * 单个「排除角色组合」的表达式文本（**取非之前的原样算式，不自动加外层括号**）。
 *
 * 「排除队友」和「必要队友」一样：用户选的「与 / 或」原样写进表达式，因此可以用「或」切分
 * 「角色组合」、靠运算优先级实现对多个组合的精准选择；取非统一留到组装「队友条件」时
 * 由 teammateExpr 把整段加括号后一次性完成（组合「或」→ !(甲 || 乙)，组合「与」→ !(甲 && 乙)）。
 * 因此这里**不要**对每一项自己取非，也不要按德摩根律取反运算符。
 */
function excludeChainText(chain) {
  const list = ((chain && chain.items) || []).filter(x => x && x.name);
  if (!list.length) return '';
  const mode = ((chain && chain.ops || [])[0] === 'and') ? 'and' : 'or';
  return joinInPartyItems(list.map(x => ({ name: x.name, neg: false })), chain.ops, mode);
}

/** 把要嵌进整条表达式里的片段包一层括号：有顶层的 && / || 时必需，否则会被外层运算符吃掉 */
function parenIfLogical(text) {
  if (!hasTopLevelLogical(text)) return text;
  return fullyWrapped(text) ? text : `(${text})`;
}

/** 文本是否已经被一对外层括号完整包住（`(a || b)`），是的话不必再套一层 */
function fullyWrapped(text) {
  const t = String(text || '').trim();
  if (!/^\(.*\)$/.test(t)) return false;
  let depth = 0;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === '(') depth++;
    else if (t[i] === ')') { depth--; if (depth === 0) return i === t.length - 1; }
  }
  return false;
}

/** 文本里是否存在「顶层」的 && / ||（括号里面的不算） */
function hasTopLevelLogical(text) {
  const t = String(text || '');
  let depth = 0;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (ch === '(') { depth++; continue; }
    if (ch === ')') { depth--; continue; }
    if (depth === 0 && (ch === '&' || ch === '|') && t[i + 1] === ch) return true;
  }
  return false;
}

/** 「排除队友」表达式（单个「角色组合」）→ !( … )；没有排除队友时返回 '' */
function excludeExprOf(tb) {
  const text = excludeGroupTextOf(tb);
  return text ? `!(${text})` : '';
}

/** 自动排除：本动作引用的其他动作 */
function effectiveAutoExclude(act, actions) {
  const out = new Set(act.teammates?.autoExclude || []);
  if (act.teammates?.autoExcludeSameType) {
    for (const a of actions) {
      if (a.id === act.id) continue;
      if ((a.character || '') !== (act.character || '')) continue;
      if (a.type !== act.type) continue;
      out.add(a.id);
    }
  }
  return [...out];
}

/**
 * 自动排除表达式：对被勾选动作的「必要队友」表达式去重（空表达式忽略），每项取非：
 *   !( 甲动作必要队友 ) && !( 乙动作必要队友 ) && …
 * 勾了的动作都没有必要队友时返回 ''（等于没有自动排除）。
 */
function autoExcludeExpr(act, actions) {
  const list = actions || state.strategy.actions;
  const seen = new Set();
  const clauses = [];
  for (const id of effectiveAutoExclude(act, list)) {
    const other = list.find(a => a.id === id);
    if (!other) continue;
    const inc = includeExprOf(other.teammates);
    if (!inc) continue;              // 没设置必要队友则忽略
    if (seen.has(inc)) continue;     // 多个动作的必要队友表达式相同时只取一次
    seen.add(inc);
    clauses.push(`!(${inc})`);
  }
  return clauses.join(' && ');       // 勾了的动作都没有必要队友 → 等于没有自动排除
}

/** 队友条件表达式片段；返回 '' 表示没有队友条件
 * 三种结构（「排除队友」整段加括号后统一取非，里面的运算符与用户所选一致，见 excludeChainText）：
 *   a) 只有必要队友： (必要队友)
 *   b) 还有排除队友： (必要队友或true) && !(排除队友或false)
 *   c) 还有自动排除： (必要队友或true) && !(排除队友或false) && (true) && (自动排除)
 * 「排除队友」为空时括号里填 false，取非后正好是 true（= 视为满足）。
 * 其中 c) 里那个 `true` 是恒等占位，它同时是**格式标记**：导入时看到它就说明这份队友条件是
 * 本编辑器写出来的，里面的取非项才需要按「是否等于某个同角色动作的必要队友表达式」进一步
 * 区分「自动排除」和「排除队友」；没有这个标记的旧格式表达式两者同形，只能一律按排除队友还原。
 */
/** 队友条件表达式片段；返回 '' 表示没有队友条件（触发条件原样写入）
 * 三种结构（「排除队友」整段加括号后统一取非，里面的运算符与用户所选一致，见 excludeChainText）：
 *   a) 只有必要队友： (必要队友)
 *   b) 还有排除队友： (必要队友或true) && !(排除队友或false)
 *   c) 还有自动排除： (必要队友或true) && !(排除队友或false) && (true) && (自动排除)
 * 只有排除队友（没有自动排除）时省掉 (true) 占位，直接写 !(排除队友)。
 * 返回值不含最外层括号：由 buildExpression 在拼接时按需包一层（见 parenIfLogical）。
 * 其中 c) 里那个 `true` 是恒等占位，它同时是**格式标记**：导入时看到它就说明这份队友条件是
 * 本编辑器写出来的，里面的取非项才需要按「是否等于某个同角色动作的必要队友表达式」进一步
 * 区分「自动排除」和「排除队友」；没有这个标记的旧格式表达式两者同形，只能一律按排除队友还原。
 */
/** 把一个片段当作「单个操作数」嵌进更大的算式：必要时整体包一层括号，避免被外层运算符吃掉 */
function wrapOperand(text) {
  return fullyWrapped(text) ? text : `(${text})`;
}

/** 「必要队友」当作单个操作数：整体包一层括号（in-party 项数量不限，一层就够） */
function includeOperand(text) {
  return `(${text})`;
}

function teammateExpr(act, actions) {
  const tm = act.teammates || {};
  const inc = includeExprOf(tm);
  const exc = excludeGroupTextOf(tm);
  const autoRaw = autoExcludeExpr(act, actions);
  // 结构 a) 只有必要队友
  if (!exc && !autoRaw) return inc ? includeOperand(inc) : '';
  // 「排除队友」那一段：整段加括号后取非；为空时写 !(false)（恒真占位，同时是新格式的标记）
  const excPart = `!(${exc || 'false'})`;
  // 结构 b) 还有排除队友。必要队友为空、且不需要写自动排除（结构 c）时省掉 (true) 占位
  if (!autoRaw) return inc ? `${includeOperand(inc)} && ${excPart}` : excPart;
  // 结构 c) 还有自动排除
  return `${inc ? includeOperand(inc) : '(true)'} && ${excPart} && (true) && (${autoRaw})`;
}

/** 组装最终 condition.expression */
function buildExpression(act, actions) {
  const own = (act.conditionText || '').trim();
  const tm = teammateExpr(act, actions);
  if (!tm) return own;
  return `(${own || 'true'}) && ${wrapOperand(tm)}`;
}

/** morePriorities 最终条目 */
function buildMorePriorities(act, actions) {
  const tm = teammateExpr(act, actions);
  return (act.morePriorities || []).map(mp => {
    const own = (mp.text || '').trim();
    const expression = tm ? `(${own || 'true'}) && ${wrapOperand(tm)}` : own;
    return { expression, priority: mp.priority, cmp: mp.cmp, scope: mp.scope, text: own };
  });
}

/* ---------------- 条件表达式拆分（触发条件 / 队友条件） ----------------
 * 与组装规则对应的反推：
 *   1) 顶层 && 链里的「队友条件」段：以第一个含 in-party 的操作数（或纯占位段
 *      `!(false)`）为锚点，再往前把 `true` / `!(false)` 这些占位操作数一起收进来；
 *      剩下的（去掉末尾多余的 true 占位）是「触发条件」；
 *   2) 队友条件里：不取非的 in-party 组合 → 必要队友；取非项 → 排除队友 / 自动排除：
 *      本编辑器导出的排除队友是「整段加括号取非」（!(甲 || 乙) / !(甲 && 乙)），
 *      自动排除的每一项则是 `!(该动作的必要队友表达式)`，并紧跟在一个 `(true)` 格式标记之后；
 *   3) 「自动排除」与「手选的排除队友」用「是否等于某个同角色动作的必要队友表达式」区分，
 *      且只有带 `(true)` 格式标记时才区分（旧格式表达式两者同形，一律按排除队友还原，避免丢内容）；
 *   4) 拆不出来（含 in-party 但不属于以上结构）时不拆，整条表达式按触发条件导入，避免丢内容。
 */

/** 表达式里是否出现 in-party(...) */
function condContainsInParty(node) {
  let found = false;
  condWalk(node, (n) => { if (n.type === 'call' && n.lower === 'in-party') found = true; });
  return found;
}

/** 把顶层 && 链摊平成操作数数组（括号在 AST 里已经消失，这里按运算顺序还原） */
function flattenAndOperands(node) {
  if (node && node.type === 'binary' && node.op === '&&') {
    return [...flattenAndOperands(node.left), ...flattenAndOperands(node.right)];
  }
  return [node];
}

/** 布尔字面量占位（true / false） */
function condBoolPlaceholder(node, value) {
  return !!node && node.type === 'bool' && node.value === value;
}

/** 文本是否等价于「一个括号里只有布尔字面量」（`(false)` / `((true))`） */
function textIsBoolPlaceholder(text, value) {
  return String(text || '').replace(/\s+/g, '') === String(value);
}

/** 是否恒假占位：文本（可能带括号）等于 false */
function isFalseText(text) { return textIsBoolPlaceholder(text, false); }

/**
 * 拆解纯 in-party 链：返回 { items: [{name, neg}], ops: ['and'|'or'…] }（ops 是表达式里的运算符），
 * 不是纯 in-party 链时返回 null。经过取非时按德摩根取反（!(A && B) ⇔ !A || !B）。
 */
function splitInPartyChain(node) {
  if (!node) return null;
  if (node.type === 'call' && node.lower === 'in-party') {
    const a = node.args && node.args[0];
    if (!a || a.type !== 'ident') return null;   // 参数必须是裸角色名
    return { items: [{ name: a.name, neg: false }], ops: [] };
  }
  if (node.type === 'unary' && node.op === '!') {
    const r = splitInPartyChain(node.operand);
    if (!r) return null;
    return { items: r.items.map(x => ({ name: x.name, neg: !x.neg })), ops: r.ops.map(invertTeamOp) };
  }
  if (node.type === 'binary' && (node.op === '&&' || node.op === '||')) {
    const L = splitInPartyChain(node.left);
    if (!L) return null;
    const R = splitInPartyChain(node.right);
    if (!R) return null;
    return { items: [...L.items, ...R.items], ops: [...L.ops, node.op === '&&' ? 'and' : 'or', ...R.ops] };
  }
  return null;
}

/**
 * 按顶层 && 把一段算式切成若干片段（保留每段里 || 的原文），用于旧格式「逐项取非」的还原：
 *   `甲 || 乙 && 丙` → ['甲 || 乙', '丙']
 */
function splitTopLevelAndText(text) {
  const t = String(text || '');
  const out = [];
  let depth = 0;
  let cur = '';
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (ch === '(') depth++;
    else if (ch === ')') depth--;
    if (depth === 0 && ch === '&' && t[i + 1] === '&') {
      out.push(cur.trim());
      cur = '';
      i++;
      continue;
    }
    cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

/** 把一个「排除队友」片段（用户所作的写法）转成 model chain：项不取非、运算符取反（德摩根） */
function invertedExcludeChain(part) {
  const parsed = condParse(part, []);
  const r = parsed.ast ? splitInPartyChain(parsed.ast) : null;
  if (!r || !r.items.length) return null;
  if (r.items.some(x => x.neg)) return null;
  return { items: r.items.map(x => ({ name: x.name, neg: false })), ops: r.ops.map(invertTeamOp) };
}

/** 把若干条 in-party 链按顺序接起来（链与链之间在表达式里是 &&，即 'and'） */function concatInPartyChains(groups) {
  const items = [];
  const ops = [];
  for (const g of (groups || [])) {
    if (!g || !g.items.length) continue;
    if (items.length) ops.push('and');
    g.items.forEach((it, k) => {
      if (k > 0) ops.push(g.ops[k - 1]);
      items.push(it);
    });
  }
  return { items, ops };
}

/**
 * 取一个「取非片段」在取非之前的原文，用于和「其他动作的必要队友表达式」比对（自动排除）。
 * 新版导出：!(in-party(甲) || in-party(乙)) → 剥掉最外层的 ! 与它包裹的括号，得到组合本身；
 * 旧版导出：!in-party(甲) → 得到 in-party(甲)；
 * 取非的对象是「逐项取非的混合表达式」时（旧的排除队友写法）返回原文，交给调用方按德摩根还原。
 */
function negatedInnerText(node) {
  const operand = node && node.type === 'unary' && node.op === '!' ? node.operand : null;
  if (!operand) return '';
  const txt = condToText(operand);
  // 只剥一层「包住整个操作数的括号」（AST 里括号已经消失，这里按文本还原）
  if (/^\(.*\)$/.test(txt)) {
    let depth = 0;
    let wraps = true;
    for (let i = 0; i < txt.length; i++) {
      if (txt[i] === '(') depth++;
      else if (txt[i] === ')') { depth--; if (depth === 0 && i < txt.length - 1) { wraps = false; break; } }
    }
    if (wraps) return txt.slice(1, -1).trim();
  }
  return txt;
}

/** 「队友条件」段可能从某个恒真占位（(true) / true）或空排除占位 `!(false)` 开始 */
function isTeammateLeadingPlaceholder(node) {
  if (!node) return false;
  if (node.type === 'bool') return node.value === true;                       // (true) / true
  if (node.type === 'unary' && node.op === '!') return isFalseText(negatedInnerText(node));  // !(false)
  return false;
}

/**
 * 拆解「队友条件」操作数列表。
 * 返回 { ok:true, inc, autoGroups:[…], ops } 或 { ok:false, reason }
 *   inc        —— 不取非的 in-party 组合（必要队友）
 *   autoGroups —— 取非项：{ matcherText, chain, wholeGroup, negChain }
 *                 · matcherText 是该项取非前的原文，用于和「同角色其他动作的必要队友表达式」比对；
 *                 · wholeGroup = 取非的对象外面本来有一层括号（本编辑器新格式 `!(甲 && 乙)`）：
 *                   括号在 AST 里是透明的（cond.js 会给这样的节点打 paren 标记），靠它才能把新格式
 *                   的「整段取非」与旧格式的「逐项取非」区分开 —— 两者拆出来的 in-party 链完全同形；
 *                 · negChain = 还原成用户所选写法的「排除队友」组合（新格式原样采用，旧格式按德摩根反推）。
 *   ops        —— 原始操作数（调用方用它判断有没有 `true` 格式标记）
 * 说明：取非项究竟是「用户手选的排除队友」还是「自动排除」，本编辑器的新格式靠
 * `(true)` 格式标记 + 必要队友表达式比对来区分；旧格式 / 手写表达式解析后两者同形，
 * 由调用方统一按排除队友还原（见 analyzeImport 第二步的说明）。
 */
function decomposeTeammate(operands) {
  const incGroups = [];
  const negGroups = [];
  const ops = (operands || []).filter(Boolean);
  for (const n of ops) {
    if (n.type === 'bool') continue;                        // true / false 占位
    if (n.type === 'unary' && n.op === '!') {
      const inner = negatedInnerText(n);
      // `!(false)` 是「排除队友」为空时的占位（取非后恒真），不是任何角色组合
      if (textIsBoolPlaceholder(inner, false)) continue;
      const series = splitInPartyChain(n);
      if (!series || !series.items.length) {
        return { ok: false, reason: `出现了既不是 in-party 组合、也不是取非的 in-party 组合的片段「${condToText(n)}」` };
      }
      const wholeGroup = !!(n.operand && n.operand.paren);
      negGroups.push({ matcherText: inner, chain: series, wholeGroup, negChain: excludeChainFromNegation(inner, wholeGroup) });
      continue;
    }
    const chain = splitInPartyChain(n);
    if (!chain) return { ok: false, reason: `出现了既不是 in-party 组合、也不是取非的 in-party 组合的片段「${condToText(n)}」` };
    const negs = new Set(chain.items.map(x => !!x.neg));
